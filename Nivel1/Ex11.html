<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro</title>
  </head>

  <body>
    <h1 id="titulo">Cadastro</h1>

    <input type="text" id="nome" placeholder="Digite seu nome" />

    <input type="number" id="idade" placeholder="Digite sua idade" />

    <button id="cadastrar">Cadastrar</button>

    <p id="resultado"></p>

    <script>
      const nome = document.querySelector("#nome");
      const idade = document.querySelector("#idade");
      const botao = document.querySelector("#cadastrar");
      const resultado = document.querySelector("#resultado");

      botao.addEventListener("click", function () {
        const nomeDigitado = nome.value;
        const idadeDigitada = Number(idade.value);

        if (idadeDigitada >= 18) {
          resultado.textContent =
            "Olá, " + nomeDigitado + "! Você é maior de idade.";
        } else {
          resultado.textContent =
            "Olá, " + nomeDigitado + "! Você é menor de idade.";
        }

        console.log(resultado.textContent);
      });
    </script>
  </body>
</html>
