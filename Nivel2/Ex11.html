<input id="nome" type="text" />
<button id="botao">Verificar</button>

<p id="resultado"></p>

<script>
  const nome = document.querySelector("#nome");
  const botao = document.querySelector("#botao");
  const resultado = document.querySelector("#resultado");

  botao.addEventListener("click", function () {
    const nomeDigitado = nome.value;
    const quantidade = nomeDigitado.length;

    if (quantidade >= 5) {
      resultado.textContent = "Seu nome é grande.";
    } else {
      resultado.textContent = "Seu nome é pequeno.";
    }

    console.log(nomeDigitado);
    console.log(quantidade);
  });
</script>
