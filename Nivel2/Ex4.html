<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Entrada</title>
  </head>

  <body>
    <input type="number" id="idade" placeholder="Digite sua idade" />

    <input type="text" id="acompanhado" placeholder="sim ou nao" />

    <button id="verificar">Verificar</button>

    <p id="resultado"></p>

    <script>
      const idade = document.querySelector("#idade");
      const acompanhado = document.querySelector("#acompanhado");
      const botao = document.querySelector("#verificar");
      const resultado = document.querySelector("#resultado");

      botao.addEventListener("click", function () {
        const valorIdade = Number(idade.value);
        const valorAcompanhado = acompanhado.value;

        if (valorIdade >= 18 || valorAcompanhado === "sim") {
          resultado.textContent = "Pode entrar.";
        } else {
          resultado.textContent = "Não pode entrar.";
        }

        console.log(valorIdade);
        console.log(valorAcompanhado);
      });
    </script>
  </body>
</html>
